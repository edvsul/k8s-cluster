---
- name: Extend LVM Logical Volume
  hosts: master
  become: yes
  tasks:
    - name: Extend logical volume to 65GB and resize filesystem
      community.general.lvol:
        vg: ubuntu-vg
        lv: ubuntu-lv
        size: 65G
        resizefs: yes

- name: Extend LVM Logical Volume
  hosts: slave
  become: yes
  tasks:
    - name: Extend logical volume to 75GB and resize filesystem
      community.general.lvol:
        vg: ubuntu-vg
        lv: ubuntu-lv
        size: 75G
        resizefs: yes
