---
- name: Restore K3s Local-Path PVCs
  hosts: all
  become: yes
  vars:
    local_backup_dir: "../../../k3s-backups"
    restore_base_dir: "/restore/k3s-pvcs"
    k3s_storage_dir: "/var/lib/rancher/k3s/storage"
  
  tasks:
    - name: Load PVC mapping file
      ansible.builtin.include_vars:
        file: "{{ local_backup_dir }}/pvc-mapping.yaml"
        name: pvc_mapping
      delegate_to: localhost
      become: no
      run_once: true

    - name: Clean up old restore directory if present
      ansible.builtin.file:
        path: "{{ restore_base_dir }}"
        state: absent

    - name: Create restore directory on remote nodes
      ansible.builtin.file:
        path: "{{ restore_base_dir }}"
        state: directory
        mode: '0755'

    - name: Find backup files for this node
      ansible.builtin.find:
        paths: "{{ local_backup_dir }}/{{ inventory_hostname }}"
        patterns: "*.tar.gz"
      delegate_to: localhost
      become: no
      register: backup_files_local

    - name: Display found backups
      ansible.builtin.debug:
        msg: "Found {{ backup_files_local.files | length }} backup(s) for {{ inventory_hostname }}"

    - name: Transfer backup files to remote node
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ restore_base_dir }}/{{ item.path | basename }}"
        mode: '0644'
      loop: "{{ backup_files_local.files }}"
      when: backup_files_local.files | length > 0

    - name: Extract namespace and PVC name from backup filename
      ansible.builtin.set_fact:
        pvc_restores: "{{ pvc_restores | default([]) + [{'backup_file': item.path | basename, 'namespace': item.path | basename | regex_replace('^pvc-[a-f0-9-]+_([^_]+)_.*', '\\1'), 'pvc_name': item.path | basename | regex_replace('^pvc-[a-f0-9-]+_[^_]+_(.+)_[0-9T]+\\.tar\\.gz$', '\\1')}] }}"
      loop: "{{ backup_files_local.files }}"
      when: backup_files_local.files | length > 0

    - name: Get K3s node hostname
      ansible.builtin.command: hostname
      register: k3s_node_hostname
      changed_when: false

    - name: Get PV details from mapping for this node
      ansible.builtin.set_fact:
        node_pvs: "{{ node_pvs | default([]) + [item] }}"
      loop: "{{ pvc_mapping['items'] | default([]) }}"
      when:
        - pvc_restores is defined
        - item.kind == 'PersistentVolume'
        - item.metadata.annotations['local.path.provisioner/selected-node'] == k3s_node_hostname.stdout

    - name: Create PV directories
      ansible.builtin.file:
        path: "{{ item.spec.local.path }}"
        state: directory
        mode: '0755'
      loop: "{{ node_pvs }}"
      when: 
        - pvc_restores is defined
        - node_pvs is defined
        - node_pvs | length > 0

    - name: Restore PVC data from backups directly to new PVCs
      ansible.builtin.shell: |
        backup_file="{{ restore_base_dir }}/{{ item.0.backup_file }}"
        pv_path="{{ item.1.spec.local.path }}"
        namespace="{{ item.0.namespace }}"
        pvc_name="{{ item.0.pvc_name }}"
        
        if [ -f "${backup_file}" ] && [ -d "${pv_path}" ]; then
          echo "Restoring ${namespace}/${pvc_name} to ${pv_path}"
          
          # Clear existing contents
          echo "Clearing existing data..."
          rm -rf "${pv_path}"/*
          rm -rf "${pv_path}"/.[!.]* 2>/dev/null || true
          
          # Extract backup directly to PVC directory
          echo "Extracting backup..."
          tar -xzf "${backup_file}" -C "${pv_path}"
          
          # Fix ownership for applications running as www-data (UID 33)
          echo "Fixing ownership..."
          chown -R 33:33 "${pv_path}"
          
          echo "Restored successfully"
        else
          echo "Skipping: backup or destination not found"
          exit 1
        fi
      loop: "{{ pvc_restores | product(node_pvs) | list }}"
      when:
        - pvc_restores is defined
        - node_pvs is defined
        - item.0.namespace == item.1.spec.claimRef.namespace
        - item.0.pvc_name == item.1.spec.claimRef.name
      register: restore_results
      failed_when: false

    - name: Clean up old restore directory if present
      ansible.builtin.file:
        path: "{{ restore_base_dir }}"
        state: absent
