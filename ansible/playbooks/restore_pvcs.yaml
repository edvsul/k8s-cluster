---
- name: Restore K3s Local-Path PVCs
  hosts: all
  become: yes
  vars:
    local_backup_dir: "../../../k3s-backups"
    restore_base_dir: "/restore/k3s-pvcs"
    k3s_storage_dir: "/var/lib/rancher/k3s/storage"
  
  tasks:
    - name: Load PVC mapping file
      ansible.builtin.include_vars:
        file: "{{ local_backup_dir }}/pvc-mapping.yaml"
        name: pvc_mapping
      delegate_to: localhost
      become: no
      run_once: true

    - name: Clean up old restore directory if present
      ansible.builtin.file:
        path: "{{ restore_base_dir }}"
        state: absent

    - name: Create restore directory on remote nodes
      ansible.builtin.file:
        path: "{{ restore_base_dir }}"
        state: directory
        mode: '0755'

    - name: Find backup files for this node
      ansible.builtin.find:
        paths: "{{ local_backup_dir }}/{{ inventory_hostname }}"
        patterns: "*.tar.gz"
      delegate_to: localhost
      become: no
      register: backup_files_local

    - name: Display found backups
      ansible.builtin.debug:
        msg: "Found {{ backup_files_local.files | length }} backup(s) for {{ inventory_hostname }}"

    - name: Transfer backup files to remote node
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ restore_base_dir }}/{{ item.path | basename }}"
        mode: '0644'
      loop: "{{ backup_files_local.files }}"
      when: backup_files_local.files | length > 0

    - name: Extract PVC ID from backup filename
      ansible.builtin.set_fact:
        pvc_restores: "{{ pvc_restores | default([]) + [{'backup_file': item.path | basename, 'pvc_id': item.path | basename | regex_replace('^(pvc-[a-f0-9-]+)_.*', '\\1')}] }}"
      loop: "{{ backup_files_local.files }}"
      when: backup_files_local.files | length > 0

    - name: Get K3s node hostname
      ansible.builtin.command: hostname
      register: k3s_node_hostname
      changed_when: false

    - name: Get PV details from mapping for this node
      ansible.builtin.set_fact:
        node_pvs: "{{ node_pvs | default([]) + [item] }}"
      loop: "{{ pvc_mapping['items'] | default([]) }}"
      when:
        - pvc_restores is defined
        - item.kind == 'PersistentVolume'
        - item.metadata.annotations['local.path.provisioner/selected-node'] == k3s_node_hostname.stdout

    - name: Create PV directories
      ansible.builtin.file:
        path: "{{ item.spec.local.path }}"
        state: directory
        mode: '0755'
      loop: "{{ node_pvs }}"
      when: 
        - pvc_restores is defined
        - node_pvs is defined
        - node_pvs | length > 0

