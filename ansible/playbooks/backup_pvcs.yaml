---
- name: Backup K3s Local-Path PVCs
  hosts: all
  become: yes
  vars:
    backup_base_dir: "/backup/k3s-pvcs"
    backup_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
    local_backup_dir: "../../../k3s-backups"
  
  tasks:
    - name: Clean up old backup files from remote nodes
      ansible.builtin.file:
        path: "{{ backup_base_dir }}"
        state: absent

    - name: Create backup directory on remote nodes
      ansible.builtin.file:
        path: "{{ backup_base_dir }}"
        state: directory
        mode: '0755'

    - name: Get list of PV paths on this node
      ansible.builtin.shell: |
        if [ -d /var/lib/rancher/k3s/storage ]; then
          find /var/lib/rancher/k3s/storage -maxdepth 1 -type d -name "pvc-*" | sort
        fi
      register: pv_paths
      changed_when: false
      failed_when: false

    - name: Display found PVCs
      ansible.builtin.debug:
        msg: "Found {{ pv_paths.stdout_lines | length }} PVCs on {{ inventory_hostname }}"

    - name: Backup each PVC
      ansible.builtin.shell: |
        pvc_name=$(basename "{{ item }}")
        backup_file="{{ backup_base_dir }}/${pvc_name}_{{ backup_timestamp }}.tar.gz"
        tar -czf "${backup_file}" -C "{{ item }}" .
        echo "${backup_file}"
      loop: "{{ pv_paths.stdout_lines }}"
      when: pv_paths.stdout_lines | length > 0
      register: backup_results

    - name: List created backups
      ansible.builtin.find:
        paths: "{{ backup_base_dir }}"
        patterns: "*.tar.gz"
      register: backup_files

    - name: Display backup summary
      ansible.builtin.debug:
        msg: "Created {{ backup_files.files | length }} backup(s) on {{ inventory_hostname }}"

- name: Fetch backups to local machine
  hosts: all
  become: yes
  vars:
    backup_base_dir: "/backup/k3s-pvcs"
    local_backup_dir: "../../../k3s-backups"
  
  tasks:
    - name: Create local backup directory
      ansible.builtin.file:
        path: "{{ local_backup_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: no

    - name: Transfer backup files to local machine using scp
      ansible.builtin.shell: |
        scp -o StrictHostKeyChecking=no {{ ansible_user }}@{{ ansible_host }}:{{ item.path }} {{ local_backup_dir }}/{{ inventory_hostname }}/
      loop: "{{ backup_files.files }}"
      delegate_to: localhost
      become: no
      when: backup_files.files is defined and backup_files.files | length > 0

    - name: Clean up old backup files from remote nodes
      ansible.builtin.file:
        path: "{{ backup_base_dir }}"
        state: absent

- name: Generate PVC mapping file
  hosts: localhost
  connection: local
  become: no
  vars:
    local_backup_dir: "../../../k3s-backups"
  
  tasks:
    - name: Get PVC information from cluster
      ansible.builtin.shell: |
        kubectl --kubeconfig=../../../k3s.yaml get pvc -A -o json
      register: pvc_info
      changed_when: false
      failed_when: false

    - name: Get PV information from cluster
      ansible.builtin.shell: |
        kubectl --kubeconfig=../../../k3s.yaml get pv -o json
      register: pv_info
      changed_when: false
      failed_when: false

    - name: Save PVC mapping
      ansible.builtin.copy:
        content: |
          # K3s PVC Backup Mapping
          # Generated: {{ ansible_date_time.iso8601 }}
          
          ## PVCs
          {{ pvc_info.stdout | from_json | to_nice_yaml }}
          
          ## PVs
          {{ pv_info.stdout | from_json | to_nice_yaml }}
        dest: "{{ local_backup_dir }}/pvc-mapping.yaml"
      when: pvc_info.rc == 0 and pv_info.rc == 0

    - name: Display backup location
      ansible.builtin.debug:
        msg: |
          Backups saved to {{ local_backup_dir }}/
          
          Note: Kubernetes manifests are managed via GitOps and not backed up here.
          Ensure your Git repository is up to date before uninstalling K3s.
