apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  interval: 15m
  timeout: 5m
  dependsOn:
    - name: kube-prometheus-stack
      namespace: monitoring
  chart:
    spec:
      chart: uptime-kuma
      version: '4.2.0'
      sourceRef:
        kind: HelmRepository
        name: uptime-kuma
        namespace: monitoring
      interval: 5m
  releaseName: uptime-kuma
  values:
    ingress:
      enabled: true
      hosts:
        - host: uptime.edvsul.org
