apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "93.9.0"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
    - paths: ["/metadata/annotations/prometheus-operator-validated"]
      target:
        kind: PrometheusRule
  values:
    grafana:
      admin:
        existingSecret: admin-creds
      ingress:
        enabled: true
        ingressClassName: cilium
        hosts:
        - grafana.edvsul.org
        pathType: Prefix
        tls:
        - secretName: staging-edvsul.org
          hosts:
          - grafana.edvsul.org
    prometheus:
      prometheusSpec:
        retention: 7d
        storageSpec:
          volumeClaimTemplate:
            metadata:
              labels:
                # Opt out of the Longhorn "default" S3 backup group: PVC labels override the
                # volume's, and "no-backup" has no RecurringJob attached.
                recurring-job.longhorn.io/source: enabled
                recurring-job-group.longhorn.io/no-backup: enabled
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 10Gi
    # Flux controllers stopped exporting per-object readiness metrics in v2.1;
    # kube-state-metrics generates gotk_resource_info from the CR status instead.
    kube-state-metrics:
      rbac:
        extraRules:
          - apiGroups: [kustomize.toolkit.fluxcd.io]
            resources: [kustomizations]
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: "The current state of a Flux Kustomization."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      namespace: [metadata, namespace]
                      customresource_kind: [kind]
                      ready: [status, conditions, "[type=Ready]", status]
                      reason: [status, conditions, "[type=Ready]", reason]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
    defaultRules:
      rules:
        kubeProxy: false
    alertmanager:
      alertmanagerSpec:
        # Mount the secret containing your Slack webhook URL
        secrets:
          - alertmanager-slack-secret
      config:
        global:
          # Reference the mounted secret file instead of hardcoding the URL
          slack_api_url_file: '/etc/alertmanager/secrets/alertmanager-slack-secret/slack_api_url'
        route:
          group_by: ['namespace', 'alertname']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 3h
          receiver: 'slack-alerts'
          routes:
            # Silence the default Watchdog heartbeat alert so it doesn't spam Slack
            - matchers:
                - alertname = "Watchdog"
              receiver: 'null'
            # Route pod restart alerts directly to Slack
            - matchers:
                - alertname = "KubePodCrashLoopingOrRestarting"
              receiver: 'slack-alerts'
            # Route Flux Kustomization failures directly to Slack
            - matchers:
                - alertname = "FluxKustomizationNotReady"
              receiver: 'slack-alerts'
        receivers:
          - name: 'null'
          - name: 'slack-alerts'
            slack_configs:
              - channel: '#alert'
                send_resolved: true
                title: '{{ if eq .Status "firing" }}:rotating_light: FIRING{{ else }}:white_check_mark: RESOLVED{{ end }} - {{ .CommonLabels.alertname }}'
                text: >-
                  {{ range .Alerts }}
                  *Namespace:* {{ .Labels.namespace }}
                  {{ if .Labels.pod }}*Pod:* {{ .Labels.pod }}
                  *Container:* {{ .Labels.container }}{{ end }}
                  {{ if .Labels.customresource_kind }}*{{ .Labels.customresource_kind }}:* {{ .Labels.name }}
                  *Reason:* {{ .Labels.reason }}{{ end }}
                  *Summary:* {{ .Annotations.summary }}
                  *Details:* {{ .Annotations.description }}
                  {{ end }}
    # Add custom PrometheusRule to detect pod restarts
    additionalPrometheusRulesMap:
      custom-pod-rules:
        groups:
          - name: pod-restart-alerts
            rules:
              - alert: KubePodCrashLoopingOrRestarting
                expr: increase(kube_pod_container_status_restarts_total[15m]) > 2
                for: 2m
                labels:
                  severity: warning
                annotations:
                  summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is restarting frequently"
                  description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted more than 2 times in the last 15 minutes."
          - name: flux-kustomization-alerts
            rules:
              - alert: FluxKustomizationNotReady
                expr: gotk_resource_info{customresource_kind="Kustomization", ready!="True", suspended!="true"} > 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Kustomization {{ $labels.namespace }}/{{ $labels.name }} is not ready"
                  description: "Kustomization {{ $labels.namespace }}/{{ $labels.name }} has been not ready for 10 minutes (reason: {{ $labels.reason }}). Check `flux get kustomizations -A`."
