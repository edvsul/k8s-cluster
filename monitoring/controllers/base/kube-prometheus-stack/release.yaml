apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.3.0"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
    - paths: ["/metadata/annotations/prometheus-operator-validated"]
      target:
        kind: PrometheusRule
  values:
    grafana:
      admin:
        existingSecret: admin-creds
      ingress:
        enabled: true
        ingressClassName: cilium
        hosts:
        - grafana.edvsul.org
        pathType: Prefix
        tls:
        - secretName: staging-edvsul.org
          hosts:
          - grafana.edvsul.org
    prometheus:
      prometheusSpec:
        retention: 7d
        storageSpec:
          volumeClaimTemplate:
            metadata:
              labels:
                # Opt out of the Longhorn "default" S3 backup group: PVC labels override the
                # volume's, and "no-backup" has no RecurringJob attached.
                recurring-job.longhorn.io/source: enabled
                recurring-job-group.longhorn.io/no-backup: enabled
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 10Gi
