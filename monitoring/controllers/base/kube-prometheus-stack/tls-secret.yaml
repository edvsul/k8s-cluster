### Reflector copy secret to the target namespace
# Contains no secret material: reflector fills tls.crt/tls.key from
# cert-manager/edvsul.org at runtime. The empty keys are required because the API
# server rejects a kubernetes.io/tls secret that omits them.
# ssa: IfNotPresent stops Flux re-applying the empty values over reflector's copy.
apiVersion: v1
kind: Secret
metadata:
  name: edvsul.org
  namespace: monitoring
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: cert-manager/edvsul.org
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
