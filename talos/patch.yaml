machine:
  network:
    interfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 10.0.0.81/24
        routes:
          - network: 0.0.0.0/0
            gateway: 10.0.0.1
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: control-plane
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 8.8.8.8
  - address: 1.1.1.1
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
