machine:
  network:
    interfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 10.0.0.81/24
        routes:
          - network: 0.0.0.0/0
            gateway: 10.0.0.1
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: control-plane
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 8.8.8.8
  - address: 1.1.1.1
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
# Schematic from talos/schematic.yaml (iscsi-tools + util-linux-tools for Longhorn)
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245:v1.14.2
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
---
# Longhorn data on EPHEMERAL, mounted at /var/mnt/longhorn. Talos 1.14 dropped kubelet
# extraMounts; user volumes are shared into the kubelet without them.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
volumeType: directory
---
# Match k3s (no PSA enforcement) so the existing infrastructure/ namespaces need no labels;
# Kyverno stays the policy layer for app namespaces. Merges into Talos's default PodSecurity
# config (audit/warn: restricted, kube-system exempt); only enforce changes from baseline.
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
configuration:
  defaults:
    enforce: privileged
