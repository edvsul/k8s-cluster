# Worker 2, 10.0.0.83 (ex-k3s worker .75, EliteDesk 16 GB)
machine:
  network:
    interfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 10.0.0.83/24
        routes:
          - network: 0.0.0.0/0
            gateway: 10.0.0.1
