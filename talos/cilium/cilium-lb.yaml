# LB pool + L2 policy from ansible/playbooks/install_cilium.yaml.
# Apply after the Cilium CRDs exist:
#   kubectl apply -f talos/cilium/cilium-lb.yaml
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan-pool
spec:
  blocks:
    - start: "10.0.0.240"
      stop: "10.0.0.250"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan-l2
spec:
  externalIPs: true
  loadBalancerIPs: true
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
