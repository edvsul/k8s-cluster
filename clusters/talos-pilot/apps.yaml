# TEMPORARY — pilot overlay for the Talos cluster, deleted at cutover (docs/talos-migration.md §5).
# Same Kustomization name and path as clusters/staging/apps.yaml, so re-pointing Flux to
# ./clusters/staging later updates this object in place instead of pruning and recreating it.
# Restore the app volumes from S3 before merging this, or Flux provisions empty PVCs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1m0s
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/staging
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  patches:
    # cloudflared shares its tunnel with k3s: Cloudflare would split public traffic between
    # both clusters. Drop the connectors, their config and the tunnel credentials entirely.
    - patch: |
        $patch: delete
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: cloudflared-deployment
          namespace: linkding
    - patch: |
        $patch: delete
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: cloudflared-cm
          namespace: linkding
    - patch: |
        $patch: delete
        apiVersion: v1
        kind: Secret
        metadata:
          name: tunnel-credentials
          namespace: linkding
    - patch: |
        $patch: delete
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: cloudflared-deployment
          namespace: nextcloud
    - patch: |
        $patch: delete
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: cloudflared-cm
          namespace: nextcloud
    - patch: |
        $patch: delete
        apiVersion: v1
        kind: Secret
        metadata:
          name: tunnel-credentials
          namespace: nextcloud
    # Would import bank statements into the pilot copy and use up the PSD2 4/day limit
    - patch: |
        $patch: delete
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: firefly-iii-autoimport
          namespace: firefly-iii
