apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: keycloak
spec:
  interval: 30m
  chart:
    spec:
      chart: keycloakx
      version: "7.2.2"
      sourceRef:
        kind: HelmRepository
        name: keycloak
        namespace: keycloak
      interval: 12h
  values:
    fullnameOverride: keycloak

    replicas: 2

    updateStrategy: OnDelete

    database:
      vendor: postgres
      hostname: keycloak-db
      port: 5432
      database: keycloak
      username: keycloak
      existingSecret: keycloak-postgres-secret
      existingSecretKey: POSTGRES_PASSWORD

    dbchecker:
      enabled: true
      securityContext:
        allowPrivilegeEscalation: false
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

    # TLS terminates at Cloudflare, and cloudflared forwards X-Forwarded-* headers.
    proxy:
      mode: xforwarded

    http:
      relativePath: "/"

    command:
      - "/opt/keycloak/bin/kc.sh"
      - "start"

    extraEnv: |
      - name: KC_HOSTNAME
        value: https://keycloak.edvsul.org
      - name: JAVA_OPTS_APPEND
        value: -XX:MaxRAMPercentage=70
      - name: KC_BOOTSTRAP_ADMIN_USERNAME
        valueFrom:
          secretKeyRef:
            name: keycloak-admin-secret
            key: KC_BOOTSTRAP_ADMIN_USERNAME
      - name: KC_BOOTSTRAP_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: keycloak-admin-secret
            key: KC_BOOTSTRAP_ADMIN_PASSWORD

    securityContext:
      allowPrivilegeEscalation: false
      runAsUser: 1000
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

    podSecurityContext:
      fsGroup: 1000

    # Memory requests and limits are mandatory under the same Kyverno policy.
    resources:
      requests:
        memory: 768Mi
        cpu: 100m
      limits:
        memory: 1Gi

    # Meaningful at 2 replicas: allows one pod to be evicted during a node
    # drain while keeping the other serving logins.
    podDisruptionBudget:
      maxUnavailable: 1

    topologySpreadConstraints: |
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: keycloakx
            app.kubernetes.io/instance: keycloak
