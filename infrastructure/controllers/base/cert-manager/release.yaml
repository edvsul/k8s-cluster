apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "1.20.2"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    resources:
      cpu: 10m
      memory: 32Mi
    cainjector:
      resources:
        cpu: 10m
        memory: 32Mi
    webhook:
      resources:
        cpu: 10m
        memory: 32Mi
    
