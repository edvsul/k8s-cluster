apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-release
  namespace: longhorn-system
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: "1.11.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
      interval: 12h
  values:
    defaultBackupStore:
      backupTarget: "s3://k8s-cluster-longhorn-backups@eu-west-1/"
      backupTargetCredentialSecret: "longhorn-backup-s3"
    defaultSettings:
      defaultReplicaCount: "2"
