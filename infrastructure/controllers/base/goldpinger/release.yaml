apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldpinger
  namespace: goldpinger
spec:
  interval: 30m
  chart:
    spec:
      chart: goldpinger
      version: "1.1.2"
      sourceRef:
        kind: HelmRepository
        name: goldpinger
        namespace: goldpinger
      interval: 12h
  values:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
    extraEnv:
      - name: HOSTS_TO_RESOLVE
        value: "www.bloomberg.com google.com"
      
