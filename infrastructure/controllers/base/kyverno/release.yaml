apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-release
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno
      version: "3.7.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
      interval: 12h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Configure admission controller to skip system namespaces
    config:
      webhooks:
        - namespaceSelector:
            matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
              - kube-system
              - kube-public
              - kube-node-lease
              - longhorn-system
              - monitoring
              - kyverno
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno-policies
      version: "3.7.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
  values:
    podSecurityStandard: restricted
