apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pod-security-standards-restricted
  annotations:
    pod-policies.kyverno.io/autogen-controllers: DaemonSet,Deployment,StatefulSet
    policies.kyverno.io/title: Pod Security Standards (Restricted) + Best Practices
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Implements the complete Pod Security Standards restricted profile plus additional
      best practices including required probes and resource limits.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    # Rule 1: Require dropping ALL capabilities
    - name: require-drop-all-capabilities
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - longhorn-system
                - monitoring
                - kyverno
                - flux-system
                - renovate
      validate:
        message: "All capabilities must be dropped. Set securityContext.capabilities.drop: [ALL]"
        pattern:
          spec:
            =(ephemeralContainers):
              - =(securityContext):
                  =(capabilities):
                    drop:
                      - ALL
            =(initContainers):
              - =(securityContext):
                  =(capabilities):
                    drop:
                      - ALL
            containers:
              - =(securityContext):
                  =(capabilities):
                    drop:
                      - ALL

    # Rule 2: Disallow privilege escalation
    - name: disallow-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - longhorn-system
                - monitoring
                - kyverno
                - flux-system
                - renovate
      validate:
        message: "Privilege escalation is disallowed. Set allowPrivilegeEscalation: false"
        pattern:
          spec:
            =(ephemeralContainers):
              - =(securityContext):
                  =(allowPrivilegeEscalation): false
            =(initContainers):
              - =(securityContext):
                  =(allowPrivilegeEscalation): false
            containers:
              - =(securityContext):
                  =(allowPrivilegeEscalation): false

    # Rule 3: Require runAsNonRoot
    - name: require-run-as-nonroot
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - longhorn-system
                - monitoring
                - kyverno
                - flux-system
                - renovate
      validate:
        message: "Running as root is not allowed. Set runAsNonRoot: true"
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
              =(ephemeralContainers):
                - =(securityContext):
                    =(runAsNonRoot): true
              =(initContainers):
                - =(securityContext):
                    =(runAsNonRoot): true
              containers:
                - =(securityContext):
                    =(runAsNonRoot): true
          - spec:
              =(ephemeralContainers):
                - securityContext:
                    runAsNonRoot: true
              =(initContainers):
                - securityContext:
                    runAsNonRoot: true
              containers:
                - securityContext:
                    runAsNonRoot: true

    # Rule 4: Require runAsUser > 0
    - name: require-run-as-non-root-user
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - longhorn-system
                - monitoring
                - kyverno
                - flux-system
                - renovate
      validate:
        message: "Running as root user (UID 0) is not allowed. Set runAsUser > 0"
        pattern:
          spec:
            =(securityContext):
              =(runAsUser): ">0"
            =(ephemeralContainers):
              - =(securityContext):
                  =(runAsUser): ">0"
            =(initContainers):
              - =(securityContext):
                  =(runAsUser): ">0"
            containers:
              - =(securityContext):
                  =(runAsUser): ">0"

    # Rule 5: Restrict seccomp (strict)
    - name: restrict-seccomp-strict
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - longhorn-system
                - monitoring
                - kyverno
                - flux-system
                - renovate
      validate:
        message: "Seccomp profile must be RuntimeDefault or Localhost"
        pattern:
          spec:
            =(securityContext):
              =(seccompProfile):
                type: "RuntimeDefault | Localhost"
            =(ephemeralContainers):
              - =(securityContext):
                  =(seccompProfile):
                    type: "RuntimeDefault | Localhost"
            =(initContainers):
              - =(securityContext):
                  =(seccompProfile):
                    type: "RuntimeDefault | Localhost"
            containers:
              - =(securityContext):
                  =(seccompProfile):
                    type: "RuntimeDefault | Localhost"

    # Rule 6: Restrict volume types
    - name: restrict-volume-types
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - longhorn-system
                - monitoring
                - kyverno
                - flux-system
                - renovate
      validate:
        message: "Only configMap, csi, downwardAPI, emptyDir, ephemeral, persistentVolumeClaim, projected, and secret volumes are allowed"
        pattern:
          spec:
            =(volumes):
              - =(configMap): "?*"
              - =(csi): "?*"
              - =(downwardAPI): "?*"
              - =(emptyDir): "?*"
              - =(ephemeral): "?*"
              - =(persistentVolumeClaim): "?*"
              - =(projected): "?*"
              - =(secret): "?*"

    # Rule 7: Require pod probes
    - name: require-pod-probes
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - longhorn-system
                - monitoring
                - kyverno
                - flux-system
                - renovate
      preconditions:
        all:
          - key: "{{request.operation || 'BACKGROUND'}}"
            operator: AnyIn
            value:
              - CREATE
              - UPDATE
      validate:
        message: Liveness, readiness probes are required for all containers.
        foreach:
          - list: request.object.spec.containers[]
            deny:
              conditions:
                all:
                  - key: livenessProbe
                    operator: AllNotIn
                    value: "{{ element.keys(@)[] }}"
                  - key: readinessProbe
                    operator: AllNotIn
                    value: "{{ element.keys(@)[] }}"

    # Rule 8: Require memory requests and limits
    - name: require-memory-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - longhorn-system
                - monitoring
                - kyverno
                - flux-system
                - renovate
      validate:
        message: "Memory requests and limits are required for all containers"
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    memory: "?*"
                  limits:
                    memory: "?*"
