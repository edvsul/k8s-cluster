apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: "1.19.4"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
      interval: 12h
  values:
    bpf:
      hostLegacyRouting: false
    endpointRoutes:
      enabled: true
    ipam:
      operator:
        clusterPoolIPv4PodCIDRList:
        - 10.245.0.0/16
    operator:
      replicas: 1
      unmanagedPodWatcher:
        restart: true
    cni:
      customConf: false
    policyEnforcementMode: "default"
    tunnelPort: 8473
    tunnelProtocol: vxlan
