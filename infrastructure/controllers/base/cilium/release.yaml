apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: "1.19.4"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
      interval: 12h
  values:
    # Below are migration values for cilium 1.19.3
    bpf:
      hostLegacyRouting: true
    cluster:
      name: default
    cni:
      customConf: true
      uninstall: false
      confPath: /var/lib/rancher/k3s/agent/etc/cni/net.d
      binPath:  /var/lib/rancher/k3s/data/cni
    ipam:
      mode: cluster-pool
      operator:
        clusterPoolIPv4PodCIDRList:
        - 10.245.0.0/16
    operator:
      replicas: 1
      unmanagedPodWatcher:
        restart: false
    policyEnforcementMode: never
    routingMode: tunnel
    tunnelPort: 8473
    tunnelProtocol: vxlan
