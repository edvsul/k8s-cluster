apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: cilium
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: "1.19.3"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: cilium
      interval: 12h
  values:
    ipam:
      mode: "cluster-pool"
      operator:
        clusterPoolIPv4PodCIDRList:
          - "10.245.0.0/16"
        clusterPoolIPv4MaskSize: 24
