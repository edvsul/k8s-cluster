apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: "1.19.3"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
      interval: 12h
  values:
    ipam:
      operator:
        clusterPoolIPv4PodCIDRList:
        - 10.245.0.0/16
    operator:
      replicas: 1
    tunnelPort: 8473
    tunnelProtocol: vxlan
