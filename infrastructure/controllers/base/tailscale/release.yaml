apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: tailscale-operator
      version: "1.98.9"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: kube-system
      interval: 12h
  # OAuth credentials are supplied via the pre-created `operator-oauth`
  # Secret (see secret.yaml); no chart values overrides are needed.
