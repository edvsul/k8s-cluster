# Self-managed Tailscale subnet router.
#
# Replaces the operator-managed `Connector`. The operator runs its router on
# the pod network, which cannot reach the Cilium L2-announced ingress VIP
# (10.0.0.240) from a non-announcer node — so VPN access to longhorn.edvsul.org
# was node-dependent and usually broke. This router runs with hostNetwork, so it
# reaches the VIP over LAN ARP (exactly like a LAN client) from either node, with
# no node pinning. It advertises the same route, so DNS, the URL, and the cert
# are unchanged.
#
# Auth reuses the existing `operator-oauth` OAuth client (kube-system). The
# client secret is detected as an OAuth credential by containerboot, which mints
# a tagged auth key from --advertise-tags=tag:k8s. The tailnet ACL must
# auto-approve the 10.0.0.240/28 route for tag:k8s (the operator already relied
# on this); otherwise approve it once in the admin console.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-subnet-router
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-subnet-router
  namespace: kube-system
rules:
  # containerboot creates the state secret on first run...
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # ...then reads and updates it on every run to persist node identity.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tailscale-subnet-router-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-subnet-router
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tailscale-subnet-router
subjects:
  - kind: ServiceAccount
    name: tailscale-subnet-router
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-subnet-router
  namespace: kube-system
spec:
  replicas: 1
  # Recreate avoids two routers briefly fighting over the same state secret /
  # node identity during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tailscale-subnet-router
  template:
    metadata:
      labels:
        app: tailscale-subnet-router
    spec:
      serviceAccountName: tailscale-subnet-router
      # hostNetwork is the whole point: it lets the router reach the L2-announced
      # ingress VIP from whichever node it lands on.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: tailscale
          image: tailscale/tailscale:v1.98.4
          env:
            - name: TS_HOSTNAME
              value: k8s-home-subnet-router
            - name: TS_KUBE_SECRET
              value: tailscale-subnet-router-state
            - name: TS_USERSPACE
              value: "false"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_ROUTES
              value: 10.0.0.240/28
            - name: TS_EXTRA_ARGS
              value: --advertise-tags=tag:k8s
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: operator-oauth
                  key: client_secret
          securityContext:
            # Matches the operator's proven router config on these nodes; needed
            # to create the tun device and program the kernel routing table.
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
