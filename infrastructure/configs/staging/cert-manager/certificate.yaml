apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: edvsul.org
  namespace: cert-manager
spec:
  secretName: edvsul.org
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "longhorn-system,kube-system,monitoring,cilium-secrets,moneymatter"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "longhorn-system,kube-system,monitoring,cilium-secrets,moneymatter"
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
    group: cert-manager.io
  commonName: "*.edvsul.org"
  dnsNames:
    - "*.edvsul.org"
