apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: pod-security-standards-restricted
  annotations:
    policies.kyverno.io/title: Pod Security Standards (Restricted) + Best Practices
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Implements the complete Pod Security Standards restricted profile plus additional
      best practices including required probes and resource limits.
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers:
        - daemonsets
        - deployments
        - statefulsets
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - longhorn-system
            - monitoring
            - kyverno
            - flux-system
            - renovate
            - cilium-test-1
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    # require-drop-all-capabilities
    - expression: >-
        variables.allContainers.all(c,
          c.?securityContext.?capabilities.?drop.orValue([]).exists(d, d.upperAscii() == 'ALL'))
      message: Containers must drop `ALL` capabilities.

    # disallow-privilege-escalation
    - expression: >-
        variables.allContainers.all(c,
          c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
      message: Privilege escalation is disallowed. All containers must set the securityContext.allowPrivilegeEscalation field to `false`.

    # require-run-as-nonroot: either pod-level true (containers may not override to false),
    # or every container sets it to true
    - expression: >-
        (object.spec.?securityContext.?runAsNonRoot.orValue(false) == true &&
          variables.allContainers.all(c, c.?securityContext.?runAsNonRoot.orValue(true) == true)) ||
        variables.allContainers.all(c, c.?securityContext.?runAsNonRoot.orValue(false) == true)
      message: "Running as root is not allowed. Set runAsNonRoot: true"

    # require-run-as-non-root-user: runAsUser, where set, must be > 0
    - expression: >-
        object.spec.?securityContext.?runAsUser.orValue(1) > 0 &&
        variables.allContainers.all(c, c.?securityContext.?runAsUser.orValue(1) > 0)
      message: "Running as root user (UID 0) is not allowed. Set runAsUser > 0"

    # restrict-seccomp-strict: seccompProfile, where set, must be RuntimeDefault or Localhost
    - expression: >-
        object.spec.?securityContext.?seccompProfile.?type.orValue('RuntimeDefault') in ['RuntimeDefault', 'Localhost'] &&
        variables.allContainers.all(c,
          c.?securityContext.?seccompProfile.?type.orValue('RuntimeDefault') in ['RuntimeDefault', 'Localhost'])
      message: Seccomp profile must be RuntimeDefault or Localhost

    # restrict-volume-types
    - expression: >-
        object.spec.?volumes.orValue([]).all(v,
          has(v.configMap) || has(v.csi) || has(v.downwardAPI) || has(v.emptyDir) ||
          has(v.ephemeral) || has(v.persistentVolumeClaim) || has(v.projected) || has(v.secret))
      message: "Only the following types of volumes may be used: configMap, csi, downwardAPI, emptyDir, ephemeral, persistentVolumeClaim, projected, and secret."

    # require-memory-resources (regular containers only, as before)
    - expression: >-
        object.spec.containers.all(c,
          c.?resources.?requests[?'memory'].hasValue() &&
          c.?resources.?limits[?'memory'].hasValue())
      message: Memory requests and limits are required for all containers
