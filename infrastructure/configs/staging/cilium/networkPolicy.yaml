apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "allow-cloudflared-to-linkding"
  namespace: "linkding"
spec:
  endpointSelector:
    matchLabels:
      app: linkding
  ingress: 
  - fromEndpoints:
    - matchLabels:
        pod: cloudflared
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: "tofqdn-visibility"
spec:
  endpointSelector:
    matchLabels:
      app: renovate
