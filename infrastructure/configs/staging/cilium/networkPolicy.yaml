apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "allow-cloudflared-to-linkding"
  namespace: "linkding"
spec:
  endpointSelector:
    matchLabels:
      app: linkding
  ingress: 
  - fromEndpoints:
    - matchLabels:
        pod: cloudflared
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: "renovate-to-https"
  namespace: "renovate"
spec:
  endpointSelector: {}
    # matchLabels:
    #   pod: renovate
  egress:
    - toEndpoints:
      - matchLabels:
          "k8s:io.kubernetes.pod.namespace": kube-system
          "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
          - port: "53"
            protocol: ANY
    - toEntities:
      - world
      toPorts:
      - ports:
        - { port: "443", protocol: TCP }
