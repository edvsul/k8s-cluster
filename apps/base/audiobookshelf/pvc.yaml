apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-audiobooks-pvc
  annotations:
    recurring-job-group.longhorn.io/daily-backup: enabled
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
