apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
      - name: audiobookshelf
        image: ghcr.io/advplyr/audiobookshelf:2.33.1
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: audiobookshelf-configmap
        volumeMounts:
        - name: audiobookshelf-audiobooks
          mountPath: /audiobooks
        - name: audiobookshelf-podcasts
          mountPath: /podcasts
        - name: audiobookshelf-config
          mountPath: /config
        - name: audiobookshelf-metadata
          mountPath: /metadata
        resources:
          requests:
            memory: 256Mi
            cpu: 200m
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
      volumes:
      - name: audiobookshelf-audiobooks
        persistentVolumeClaim:
          claimName: audiobookshelf-audiobooks-pvc
      - name: audiobookshelf-podcasts
        persistentVolumeClaim:
          claimName: audiobookshelf-podcasts-pvc
      - name: audiobookshelf-config
        persistentVolumeClaim:
          claimName: audiobookshelf-config-pvc
      - name: audiobookshelf-metadata
        persistentVolumeClaim:
          claimName: audiobookshelf-metadata-pvc
