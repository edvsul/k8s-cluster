### Monthly bank import through the data importer's /autoimport endpoint.
# Imports every config in the importer's /import directory (one per bank account,
# see autoimport-secret.yaml). Runs on the 1st so the last day of the previous
# month is complete; each config uses a relative 1 month range, and duplicate
# detection skips anything already imported.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: firefly-iii-autoimport
  namespace: firefly-iii
spec:
  schedule: "0 3 1 * *"
  timeZone: Europe/Copenhagen
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: autoimport
            app.kubernetes.io/instance: firefly-iii
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 100
            runAsGroup: 101
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: autoimport
              image: curlimages/curl:8.23.0
              env:
                - name: AUTO_IMPORT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: firefly-iii-importer-autoimport
                      key: AUTO_IMPORT_SECRET
              args:
                - --fail-with-body
                - --silent
                - --show-error
                - --max-time
                - "1800"
                - --request
                - POST
                - --header
                - "Accept: application/json"
                - "http://firefly-iii-importer/autoimport?directory=/import&secret=$(AUTO_IMPORT_SECRET)"
              resources:
                requests:
                  memory: 16Mi
                  cpu: 10m
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
