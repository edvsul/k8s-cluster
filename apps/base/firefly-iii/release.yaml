apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firefly-iii
  namespace: firefly-iii
spec:
  interval: 30m
  chart:
    spec:
      chart: firefly-iii
      version: "1.10.1"
      sourceRef:
        kind: HelmRepository
        name: firefly-iii
        namespace: firefly-iii
      interval: 12h
  values:
    firefly-db:
      storage:
        accessModes: "ReadWriteOnce"
    podSecurityContext:
      fsGroup: 2000
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      #runAsUser: 1000
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi    
    ingress:
      enabled: true
      hosts:
        - "firefly.edvsul.org"
      tls:
        - secretName: "edvsul.org"
          hosts:
            - "firefly.edvsul.org"
