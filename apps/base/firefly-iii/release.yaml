apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firefly-iii
  namespace: firefly-iii
spec:
  interval: 30m
  chart:
    spec:
      chart: firefly-iii-stack
      version: "0.10.2"
      sourceRef:
        kind: HelmRepository
        name: firefly-iii
        namespace: firefly-iii
      interval: 12h
  valuesFrom:
    - kind: Secret
      name: firefly-iii-app-key-value
      valuesKey: appKey
      targetPath: firefly-iii.secrets.appKey
  values:
    firefly-db:
      enabled: false
    firefly-iii:
      config:
        env:
          DB_HOST: firefly-iii-db
          TZ: "Europe/Copenhagen"
        existingSecret: firefly-iii-credentials
      persistence:
        storageClassName: longhorn-k8s-cluster
        storage: 2Gi
      podSecurityContext:
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          memory: 256Mi
          cpu: 50m
        limits:
          memory: 768Mi
      ingress:
        enabled: true
        className: cilium
        hosts:
          - "firefly.edvsul.org"
        tls:
          - secretName: "edvsul.org"
            hosts:
              - "firefly.edvsul.org"
    importer:
      enabled: true
      fireflyiii:
        url: "http://firefly-iii:80"
        vanityUrl: "https://firefly.edvsul.org"
      config:
        env:
          TZ: "Europe/Copenhagen"
      podSecurityContext:
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          memory: 128Mi
          cpu: 25m
        limits:
          memory: 512Mi
      ingress:
        enabled: true
        className: cilium
        hosts:
          - "firefly-import.edvsul.org"
        tls:
          - secretName: "edvsul.org"
            hosts:
              - "firefly-import.edvsul.org"
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: firefly-iii
            patch: |
              - op: add
                path: /spec/template/spec/initContainers
                value:
                  - name: wait-for-db
                    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
                    command:
                      - sh
                      - -c
                      - |
                        until pg_isready -h firefly-iii-db -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                          echo "waiting for postgres..."; sleep 2
                        done
                        echo "postgres ready"
                    envFrom:
                      - secretRef:
                          name: firefly-iii-db-config
                    resources:
                      requests:
                        memory: 32Mi
                        cpu: 10m
                      limits:
                        memory: 64Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
