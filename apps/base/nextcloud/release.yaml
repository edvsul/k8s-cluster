apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 30m
  chart:
    spec:
      chart: nextcloud
      version: "8.9.0"
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: nextcloud
      interval: 12h
  valuesFrom:
  - kind: Secret
    name: nextcloud-creds
    valuesKey: username
    targetPath: nextcloud.username
  - kind: Secret
    name: nextcloud-creds
    valuesKey: password
    targetPath: nextcloud.password
  values:
    nextcloud:
      host: nextcloud.edvsul.org
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      podSecurityContext:
        fsGroup: 33
      configs:
        custom.config.php: |
          <?php
            $CONFIG = array(
              'check_data_directory_permissions' => false, # https://docs.nextcloud.com/server/latest/admin_manual/configuration_server/
            );
    phpClientHttpsFix: # Fixes the nextcloud login issue
      enabled: true
